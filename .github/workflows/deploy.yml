name: Deploy website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Website-Dateien vorbereiten
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/live

      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
